# Base de datos PostgreSQL para desarrollo local.
# Iniciar:  docker compose up -d
# Detener:  docker compose down
services:
  db:
    image: postgres:16
    container_name: visitas_db
    environment:
      POSTGRES_DB: visitas
      POSTGRES_USER: visitas
      POSTGRES_PASSWORD: visitas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
