{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary"><i class="bi bi-shield-lock-fill me-2"></i> Roles y Permisos</h2>
    <a href="{% url 'admin_rol_create' %}" class="btn btn-success">+ Nuevo Rol</a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Nombre del Rol</th>
                    <th>Clave</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for r in roles %}
                <tr>
                    <td class="align-middle">{{ r.nombre }}</td>
                    <td class="align-middle"><code>{{ r.clave }}</code></td>
                    <td>
                        <a href="{% url 'admin_rol_update' r.pk %}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil-square"></i> Editar</a>
                        <a href="{% url 'admin_rol_delete' r.pk %}" class="btn btn-sm btn-danger">Eliminar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center py-3">No hay roles registrados.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
