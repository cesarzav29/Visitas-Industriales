{% extends 'core/base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="text-primary">Panel Alumno</h2>
        <p class="text-muted">Bienvenido(a), {{ user.nombres }}.</p>
    </div>
    
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Mis Visitas</h5>
                <p class="card-text">Consulta las visitas a empresas en las que estás registrado.</p>
                <a href="#" class="btn btn-primary">Ver mis visitas</a>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Mi Perfil</h5>
                <p class="card-text">Asegúrate de tener registrado tu número de seguro facultativo.</p>
                <a href="#" class="btn btn-secondary">Actualizar datos</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
