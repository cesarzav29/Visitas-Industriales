<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Visitas a Empresas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand">Visitas a Empresas</span>
      <div class="d-flex align-items-center gap-3">
        <span class="small">{{ user.nombre_completo }} · <strong>{{ user.rol|default:"Sin rol" }}</strong></span>
        <form method="post" action="{% url 'usuarios:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
        </form>
      </div>
    </div>
  </nav>
  <main class="container py-5 text-center">
    <h1 class="mb-3">Bienvenido(a), {{ user.nombres }}</h1>
    <p class="lead">Rol: {{ user.rol|default:"Sin rol" }}</p>
    <p class="text-muted">El panel de cada rol se construye en TQV-30.</p>
    {% if user.is_staff %}<a class="btn btn-primary" href="/admin/">Panel de administración</a>{% endif %}
  </main>
</body>
</html>
